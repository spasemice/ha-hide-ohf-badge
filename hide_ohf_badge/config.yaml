name: Hide OHF Badge
version: "1.2.0"
slug: hide_ohf_badge
url: https://github.com/spasemice/ha-hide-ohf-badge
description: Hide the login/splash badge for personal visual preferences, with full support for Home Assistant and the Open Home Foundation. Start on boot ON; Watchdog ON; Protection mode OFF.
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
docker_api: true
ingress: true
ingress_port: 8099
panel_title: Logo status
panel_icon: mdi:image-off-outline
panel_admin: true
watchdog: http://[HOST]:8099/health
options: {}
schema: {}
